        description: "방위산업/건설/제조 부문 M&A 재무두딜리전스(FDD) 지원, 방산 원가체계 검증 및 기업가치평가(Valuation) 데이터 분석 지원.",
        qualifications: "CPA 유예생/합격자 우대, 파이썬/SQLD 활용가능자 우대, 재무모델링 우수자",
        applyUrl: "https://career.kr.kpmg.com/"
      },
      {
        id: 102,

        title: "감사본부(Audit) 데이터 분석 & Journal Entry Testing RA",
        company: "삼일PwC",

        location: "서울 용산구",
        type: "채용연계형/RA 인턴",
        subCategories: ["회계"],
        keywords: ["Journal Entry Test", "SQL", "K-IFRS 1115", "ICFR"],
        deadline: "2026.10.25",
        description: "상장사 및 주요 제조/방산 수주 기업 감사 절차 지원, MySQL/Python을 활용한 분개 테스트(JE Test) 및 내부회계관리제도 샘플링 검토.",
        qualifications: "CPA 1차 합격자 또는 회계학 이수자, SQL/데이터 분석 가능자 우대",

      },
      {

        description: "방위산업체 및 첨단기술 기업의 R&D 세액공제 검토, 법인세 세무조정 및 수출물자 관세/부가세 영세율 검토 지원.",
        qualifications: "CTA/CPA 준비생 우대, 세무회계 전공자",
        applyUrl: "https://join.deloitte.co.kr/"
      },
      {
        id: 104,
        mainCategory: "BIG4",
        title: "Strategy and Transactions (SaT) 제조/방산 세그먼트 RA",
        company: "EY 한영",
        tier: "Big 4 회계법인",
        location: "서울 영등포구 (여의도)",
        type: "체험형 인턴",
        subCategories: ["재무"],
        keywords: ["SaT", "사업타당성", "재무 진단", "Excel"],
        deadline: "2026.11.10",
        description: "방산 및 중공업 분야 인수합병 전략 수립, 사업 타당성 검토 및 재무 진단 모델 작성 지원.",
        qualifications: "상경계열 학사/석사, 엑셀/파워포인트 작성 우수자",
        applyUrl: "https://www.ey.com/ko_kr/careers"
      }
    ];

    function App() {
      const [mainTab, setMainTab] = React.useState('DEFENSE'); // 'DEFENSE' or 'BIG4'
      const [selectedSubCat, setSelectedSubCat] = React.useState('ALL');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [selectedJob, setSelectedJob] = React.useState(null);

      const subCategories = [
        { id: 'ALL', name: '전체' },
        { id: '원가', name: '원가 (방산원가)' },
        { id: '회계', name: '회계 / 감사' },
        { id: '재무', name: '재무 / Deal' },
        { id: '세법', name: '세법 / Tax' },
      ];

      const filteredJobs = INITIAL_JOBS.filter(job => {
        const matchesMain = job.mainCategory === mainTab;
        const matchesSub = selectedSubCat === 'ALL' || job.subCategories.includes(selectedSubCat);
        const matchesSearch = job.title.includes(searchQuery) || 
                              job.company.includes(searchQuery) || 
                              job.keywords.some(k => k.includes(searchQuery));
        return matchesMain && matchesSub && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans">
          {/* Header */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 p-2 rounded-lg font-bold text-lg">🛡️</div>

              </div>

              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8">
            {/* 1. 메인 2대 카테고리 탭 (방산 VS Big 4) */}
            <div className="flex gap-3 mb-6">
              <button
                onClick={() => { setMainTab('DEFENSE'); setSelectedSubCat('ALL'); }}
                className={`flex-1 py-4 px-6 rounded-2xl font-bold text-base transition-all flex items-center justify-center gap-2 border ${
                  mainTab === 'DEFENSE'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-500/20'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                }`}
              >
                <span>🛡️</span> 방산 기업 인턴 공고
                <span className={`text-xs px-2 py-0.5 rounded-full ${mainTab === 'DEFENSE' ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                  {INITIAL_JOBS.filter(j => j.mainCategory === 'DEFENSE').length}
                </span>
              </button>

              <button
                onClick={() => { setMainTab('BIG4'); setSelectedSubCat('ALL'); }}
                className={`flex-1 py-4 px-6 rounded-2xl font-bold text-base transition-all flex items-center justify-center gap-2 border ${
                  mainTab === 'BIG4'
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-500/20'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                }`}
              >
                <span>🏢</span> Big 4 회계법인 인턴 공고
                <span className={`text-xs px-2 py-0.5 rounded-full ${mainTab === 'BIG4' ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                  {INITIAL_JOBS.filter(j => j.mainCategory === 'BIG4').length}
                </span>
              </button>
            </div>

            {/* 2. 검색 및 세부 직무 필터 */}
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
              <input
                type="text"
                placeholder={mainTab === 'DEFENSE' ? "기업명, 키워드 (예: 방산원가, K-IFRS, 한화) 검색" : "회계법인, 본부 (예: Deal, 삼정, JE Test, Valuation) 검색"}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <div className="flex flex-wrap gap-2">
                {subCategories.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setSelectedSubCat(cat.id)}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                      selectedSubCat === cat.id
                        ? (mainTab === 'DEFENSE' ? 'bg-blue-600 text-white' : 'bg-indigo-600 text-white')
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>
            </div>

            {/* 3. 공고 리스트 */}
            <div className="grid gap-4">
              {filteredJobs.length === 0 ? (
                <div className="bg-white p-12 rounded-2xl border border-slate-200 text-center text-slate-400">
                  해당 조건에 일치하는 공고가 없습니다.
                </div>
              ) : (
                filteredJobs.map(job => (
                  <div
                    key={job.id}
                    onClick={() => setSelectedJob(job)}
                    className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-blue-400 transition-all cursor-pointer relative group"
                  >
                    <div className="flex justify-between items-start flex-wrap gap-2">
                      <div>
                        <div className="flex items-center gap-2 mb-2">
                          <span className={`text-xs font-bold px-2.5 py-1 rounded-md ${
                            job.mainCategory === 'BIG4' ? 'bg-indigo-50 text-indigo-700 border border-indigo-100' : 'bg-blue-50 text-blue-700 border border-blue-100'
                          }`}>
                            {job.company}
                          </span>
                          <span className="text-xs font-medium px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md">
                            {job.type}
                          </span>
                        </div>
                        <h3 className="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors">
                          {job.title}
                        </h3>
                        <p className="text-xs text-slate-400 mt-1">📍 {job.location} | ⏰ 마감일: {job.deadline}</p>
                      </div>
                      <button className={`text-sm font-semibold px-4 py-2 rounded-xl transition-all ${
                        job.mainCategory === 'BIG4' ? 'bg-indigo-50 text-indigo-600 group-hover:bg-indigo-100' : 'bg-blue-50 text-blue-600 group-hover:bg-blue-100'
                      }`}>
                        상세보기 ↗
                      </button>
                    </div>

                    <div className="mt-4 pt-4 border-t border-slate-100 flex flex-wrap gap-1.5">
                      {job.keywords.map((kw, i) => (
                        <span key={i} className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                          #{kw}
                        </span>
                      ))}
                    </div>
                  </div>
                ))
              )}
            </div>
          </main>

          {/* 공고 상세 모달 */}
          {selectedJob && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <span className={`text-xs font-bold px-2.5 py-1 rounded ${
                      selectedJob.mainCategory === 'BIG4' ? 'bg-indigo-50 text-indigo-700' : 'bg-blue-50 text-blue-700'
                    }`}>
                      {selectedJob.company} ({selectedJob.tier})
                    </span>
                    <h2 className="text-xl font-bold text-slate-900 mt-2">{selectedJob.title}</h2>
                  </div>
                  <button onClick={() => setSelectedJob(null)} className="text-slate-400 hover:text-slate-600 p-2 text-lg">✕</button>
                </div>
                
                <div className="space-y-4 my-6 border-y border-slate-100 py-6 text-sm text-slate-600">
                  <div>
                    <h4 className="font-bold text-slate-900 mb-1">📋 주요 업무</h4>
                    <p className="bg-slate-50 p-3 rounded-xl leading-relaxed">{selectedJob.description}</p>
                  </div>
                  <div>
                    <h4 className="font-bold text-slate-900 mb-1">🎯 자격 요건 및 우대 사항</h4>
                    <p className="bg-slate-50 p-3 rounded-xl leading-relaxed">{selectedJob.qualifications}</p>
                  </div>
                </div>

                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setSelectedJob(null)} 
                    className="px-5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50"
                  >
                    닫기
                  </button>
                  <a
                    href={selectedJob.applyUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className={`px-5 py-2.5 rounded-xl text-white text-sm font-semibold shadow-md flex items-center gap-1.5 ${
                      selectedJob.mainCategory === 'BIG4' ? 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/20' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/20'
                    }`}
                  >
                    지원하러 가기 (공식 채용 사이트) ↗
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
